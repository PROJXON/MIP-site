<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Playfair+Display:ital,wght@1,700&family=Cormorant+Garamond:ital,wght@1,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --indigo: #16284F;
      --gold: #B08A3E;
      --gold-bright: #D9B45B;
      --ivory: #FDF8F0;
      --sand: #EFE3CE;
      --ink: #4A4034;
      --ink-soft: #7C6F5E;
      --radius: 14px;
      --peacock-img: url("<?!= peacock ?>");
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    /* stop phones from enlarging the text on their own, which would make
       the invitation card grow while the painting behind it stays put */
    html {
      -webkit-text-size-adjust: 100%;
      -moz-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      padding: 14px 12px 44px;
      font-family: 'Karla', system-ui, sans-serif;
      color: var(--ink);
      line-height: 1.55;
      background-color: #DFE7E4;
      background-image:
        radial-gradient(circle at 12% 6%, #BFD6E6 0%, rgba(191, 214, 230, 0) 55%),
        radial-gradient(circle at 88% 22%, #A8CBBC 0%, rgba(168, 203, 188, 0) 52%),
        radial-gradient(circle at 78% 92%, #E7DAC0 0%, rgba(231, 218, 192, 0) 58%),
        linear-gradient(170deg, #E3EDF2 0%, #D8E6DF 45%, #EEE4D2 100%);
      background-attachment: fixed;
    }

    .sheet {
      max-width: 480px;
      margin: 0 auto;
      background: var(--ivory);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(22, 40, 79, 0.18);
    }

    /* ---------- Header: the invite artwork, full image, nothing cropped ---------- */
    .crown {
      position: relative;
      width: 100%;
      /* Locking the box to the artwork's own ratio means background-size:contain
         never needs to letterbox or crop it - the whole scene is always fully
         visible, at any screen width. */
      aspect-ratio: 946 / 1292;
      background-image: var(--peacock-img);
      background-size: contain;
      background-position: center top;
      background-repeat: no-repeat;
      background-color: #1B2036;
    }

    /* ---------- Form ---------- */
    .body { padding: 26px 22px 34px; }

    .empty-hint {
      padding: 6px 8px 4px;
      text-align: center;
      color: var(--ink-soft);
      font-size: 13.5px;
    }
    .empty-hint p { margin: 0; }

    .field-label {
      display: block;
      font-family: 'Marcellus', Georgia, serif;
      font-size: 17px;
      color: var(--indigo);
      margin: 0 0 8px;
    }
    .hint { font-size: 13px; color: var(--ink-soft); margin: 0 0 12px; }

    .select-wrap { position: relative; }
    .select-wrap::after {
      content: "";
      position: absolute;
      right: 16px; top: 50%;
      width: 8px; height: 8px;
      border-right: 2px solid var(--gold);
      border-bottom: 2px solid var(--gold);
      transform: translateY(-70%) rotate(45deg);
      pointer-events: none;
    }
    select {
      appearance: none; -webkit-appearance: none;
      width: 100%;
      padding: 14px 40px 14px 15px;
      font-family: inherit;
      font-size: 16px;
      color: var(--indigo);
      background: #fff;
      border: 1px solid var(--sand);
      border-bottom: 2px solid var(--gold);
      border-radius: var(--radius);
      cursor: pointer;
    }

    .chosen {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--sand);
      border-bottom: 2px solid var(--gold);
      border-radius: var(--radius);
      background: #fff;
    }
    .chosen-name {
      font-family: 'Marcellus', Georgia, serif;
      font-size: 17px;
      color: var(--indigo);
    }
    .link-btn {
      background: none;
      border: none;
      padding: 4px 0;
      font-family: inherit;
      font-size: 13.5px;
      color: var(--gold);
      border-bottom: 1px solid var(--sand);
      cursor: pointer;
      white-space: nowrap;
    }
    .link-btn:hover { border-bottom-color: var(--gold); }

    .family-banner {
      text-align: center;
      margin: 0 0 20px;
    }
    .family-banner .chosen-name {
      font-family: 'Marcellus', Georgia, serif;
      font-size: 23px;
      color: var(--indigo);
    }

    .guests { margin-top: 4px; }

    .guest {
      background: #fff;
      border: 1px solid var(--sand);
      border-radius: var(--radius);
      padding: 15px 16px 16px;
      margin-top: 12px;
    }
    .guest-name {
      font-family: 'Marcellus', Georgia, serif;
      font-size: 18px;
      color: var(--indigo);
      margin-bottom: 11px;
    }

    .days { display: flex; flex-wrap: wrap; gap: 8px; }
    .day { position: relative; display: inline-flex; }
    .day input {
      position: absolute;
      opacity: 0;
      width: 100%; height: 100%;
      margin: 0; cursor: pointer;
    }
    .day span {
      display: block;
      padding: 9px 15px;
      border-radius: 999px;
      border: 1px solid var(--sand);
      background: var(--ivory);
      font-size: 14px;
      color: var(--ink-soft);
      transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
    }
    .day input:checked + span {
      background: var(--indigo);
      border-color: var(--indigo);
      color: var(--gold-bright);
    }
    .day input:focus-visible + span {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    .travel { margin-top: 28px; }
    .event-note {
      margin: 26px 0 0;
      padding: 12px 14px;
      text-align: center;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-weight: 500;
      font-size: 18px;
      line-height: 1.3;
      color: var(--indigo);
      background: #fff;
      border: 1px solid var(--sand);
      border-radius: var(--radius);
    }
    .event-note + .travel { margin-top: 22px; }
    textarea {
      width: 100%;
      padding: 13px 15px;
      font-family: inherit;
      font-size: 16px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--sand);
      border-bottom: 2px solid var(--gold);
      border-radius: var(--radius);
      resize: vertical;
    }
    textarea::placeholder { color: #BCAE99; }

    button.send {
      width: 100%;
      margin-top: 22px;
      padding: 16px;
      font-family: 'Marcellus', Georgia, serif;
      font-size: 17px;
      letter-spacing: 0.02em;
      color: var(--gold-bright);
      background: var(--indigo);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 120ms ease, transform 120ms ease;
    }
    button.send:hover { background: #1D3364; }
    button.send:active { transform: scale(0.99); }
    button.send:disabled { opacity: 0.55; cursor: default; }

    #status {
      text-align: center;
      margin-top: 14px;
      font-size: 14px;
      min-height: 20px;
      color: var(--ink-soft);
    }
    #status.error { color: #9B3B2F; }

    /* ---------- Thank you ---------- */
    #thankyou { padding: 56px 28px 64px; text-align: center; }
    #thankyou h2 {
      font-family: 'Marcellus', Georgia, serif;
      font-weight: 400;
      font-size: 30px;
      color: var(--indigo);
      margin: 18px 0 10px;
    }
    #thankyou p { color: var(--ink-soft); margin: 0 auto; max-width: 300px; }
    #thankyou .again { margin-top: 26px; }

    .hidden { display: none !important; }

    @media (min-width: 520px) {
      body { padding: 40px 16px 56px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="sheet">

    <div class="crown" role="img"
         aria-label="Please join us to celebrate the wedding of Saloni and Dhruv, Avadh Utopia, Vapi, 23 to 24 December 2026"></div>

    <div id="formView" class="body">
      <div id="chosenBlock" class="family-banner">
        <span class="chosen-name" id="chosenName">Loading your invitation&hellip;</span>
      </div>

      <div id="guests" class="guests"></div>

      <div id="tail" class="hidden">
        <p class="event-note">Swagat &amp; Welcome Lunch 12 PM to 2 PM on 23rd December</p>
        <div class="travel">
          <label class="field-label" for="notes">How are you reaching Vapi?</label>
          <p class="hint">Train, car or flight &mdash; and roughly when you expect to arrive.</p>
          <textarea id="notes" rows="2" placeholder="Driving down, reaching around 12pm on the 23rd"></textarea>
        </div>
        <button id="submitBtn" class="send">Send our RSVP</button>
      </div>

      <div id="status" role="status"></div>
    </div>

    <div id="thankyou" class="hidden">
      <svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">
        <circle cx="23" cy="23" r="22" fill="none" stroke="#B08A3E" stroke-width="1"/>
        <path d="M14 23.5 L20 29.5 L32 17" fill="none" stroke="#B08A3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h2>We can't wait</h2>
      <p>Your RSVP is saved. Send it again any time if your plans change.</p>
      <button type="button" class="link-btn again" id="anotherBtn">Update our RSVP</button>
    </div>

  </div>

  <script>
    var DATES = ["Dec 23", "Dec 24"];
    var token = '';
    var familyName = '';
    var members = [];

    var $ = function (id) { return document.getElementById(id); };

    // Read ?f=... from the page link. window.location can't be used inside
    // the Apps Script sandbox, so google.script.url is the supported way.
    google.script.url.getLocation(function (loc) {
      token = (loc.parameter && loc.parameter.f) || '';
      if (!token) { showInvalid(); return; }
      google.script.run
        .withSuccessHandler(onFamilyLoaded)
        .withFailureHandler(showInvalid)
        .getMyFamily(token);
    });

    function onFamilyLoaded(f) {
      familyName = f.name;
      members = f.members || [];
      // "family" reads oddly for a single guest, so only add it for groups
      $('chosenName').textContent = members.length > 1 ? familyName + ' family' : familyName;
      renderFamily();
    }

    function showInvalid() {
      $('chosenName').textContent = 'Invitation not found';
      $('guests').innerHTML = '';
      $('tail').classList.add('hidden');
      setStatus('Please open the personal link we sent your family.', true);
    }

    $('anotherBtn').addEventListener('click', function () {
      renderFamily();
      $('thankyou').classList.add('hidden');
      $('formView').classList.remove('hidden');
      window.scrollTo(0, 0);
    });

    function renderFamily() {
      setStatus('');
      $('notes').value = '';
      $('submitBtn').disabled = true;
      $('guests').innerHTML =
        '<label class="field-label">Which day would you be arriving?</label>' +
        '<p class="hint">Please choose an option for each guest.</p>' +
        members.map(function (m, i) {
          return '' +
            '<div class="guest" data-index="' + i + '">' +
              '<div class="guest-name">' + escapeHtml(m) + '</div>' +
              '<div class="days">' +
                DATES.map(function (d) {
                  return '<label class="day">' +
                    '<input type="radio" class="day-radio" name="guest-' + i + '" value="' + d + '">' +
                    '<span>' + d + '</span></label>';
                }).join('') +
                '<label class="day absent">' +
                  '<input type="radio" class="day-radio" name="guest-' + i + '" value="">' +
                  '<span>Won\'t be attending</span></label>' +
              '</div>' +
            '</div>';
        }).join('');
      $('tail').classList.remove('hidden');
      refreshSendButton();
    }

    // The send button only wakes up once every guest has an answer
    // and the travel box has been filled in.
    function refreshSendButton() {
      var guestsDone = members.every(function (name, i) {
        return document.querySelector('input[name="guest-' + i + '"]:checked');
      });
      var travelDone = $('notes').value.trim().length > 0;

      $('submitBtn').disabled = !(guestsDone && travelDone);
      $('submitBtn').textContent = !guestsDone
        ? 'Please answer for each guest'
        : (!travelDone ? 'Please tell us how you\'re reaching Vapi' : 'Send our RSVP');
    }

    $('guests').addEventListener('change', refreshSendButton);
    $('notes').addEventListener('input', refreshSendButton);

    $('submitBtn').addEventListener('click', function () {
      var btn = this;

      var attendees = members.map(function (name, i) {
        var picked = document.querySelector('input[name="guest-' + i + '"]:checked');
        return { name: name, dates: (picked && picked.value) ? [picked.value] : [] };
      });

      btn.disabled = true;
      setStatus('Sending\u2026');

      google.script.run
        .withSuccessHandler(function () {
          $('formView').classList.add('hidden');
          $('thankyou').classList.remove('hidden');
          window.scrollTo(0, 0);
        })
        .withFailureHandler(function () {
          setStatus('That didn\'t send. Check your connection and tap send again.', true);
          btn.disabled = false;
        })
        .submitMyRSVP(token, { attendees: attendees, notes: $('notes').value });
    });

    function setStatus(msg, isError) {
      var el = $('status');
      el.textContent = msg;
      el.className = isError ? 'error' : '';
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
  </script>
</body>
</html>
